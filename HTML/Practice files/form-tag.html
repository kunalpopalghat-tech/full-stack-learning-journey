<!DOCTYPE html>
<html>

<head>

    <title>Form page</title>
</head>

<body>
    <br>

    <hr>
    <b>
        <div align="center">
            <h1>Company level task</h1>
            <hr>
            <table height="400">
                <tr>
                    <td>Name: <input type="text"></td>
                </tr>
                <tr>
                    <td>Country: <select name="Country">
                            <option value="India">India</option>
                            <option value="USA">USA</option>
                            <option value="England">England</option>
                            <option value="Australia">Australia</option>
                            <option value="South Africa">South Africa</option>
                            <option value="New zealand">New zealand</option>
                            <option value="Nederland">Nederland</option>
                            >

                        </select></td>
                </tr>
                <tr>
                    <td>Address: <textarea name="Address" rows="4" cols="40"></textarea></td>
                </tr>
                <tr>
                    <td>Birthday: <input type="date" name="Birthday"></td>
                </tr>
                <tr>
                    <td>Select your gender:
                        <input type="radio" name="gender">
                        <label for="male">Male</label>

                        <input type="radio" name="gender">
                        <label for="Female">Female</label>

                        <input type="radio" name="gender">
                        <label for="Other">Other </label>
                    </td>

                </tr>
                <tr>
                    <td>Technology known:
                        <input type="checkbox">
                        <label for="HTML">HTML</label>
                        <input type="checkbox">
                        <label for="CSS">CSS</label>
                        <input type="checkbox">
                        <label for="Python">Python</label>
                    </td>
                </tr>
                <tr align="center">
                    <td>
                        <input type="checkbox">
                        <label for="JAVA">JAVA</label>
                        <input type="checkbox">
                        <label for="Java Script">Java Script</label>
                    </td>
                </tr>
                <tr align="center">
                    <td><button type="submit">submit</button></td>
                </tr>
            </table>
        </div>
    </b>

</body>

</html>
